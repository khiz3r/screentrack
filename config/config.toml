# ScreenTrack configuration
# This file lives at ~/.config/screentrack/config.toml once installed.
# Edit directly, or use `screentrack --set-goal`, `--add-app`, etc.

[general]
idle_threshold_minutes = 5
daily_goal_hours = 6.0
notify_on_goal = true

[apps]
# Case-insensitive substring match against the focused window's class name.
# Anything that doesn't match one of these is bucketed as "Other".
whitelist = ["Firefox", "Terminal", "Code", "kitty", "Burp Suite"]

[email]
enabled = false
smtp_host = "smtp.gmail.com"
smtp_port = 587
smtp_user = ""
# For Gmail, use an App Password, not your normal password:
# https://myaccount.google.com/apppasswords
smtp_password = ""
use_tls = true
from_addr = ""
to_addr = ""
send_monthly_report = true
send_day = 1

[advanced]
poll_interval_seconds = 5
keep_history_days = 0   # 0 = keep forever
